version: "3"

tasks:
  setup:
    desc: Install pinned local dependencies
    cmds:
      - uv sync --locked --all-groups

  weights:
    desc: Download and verify the pinned weights for SYSTEM_ONE_BACKEND (von or slm)
    env:
      SYSTEM_ONE_BACKEND: '{{.SYSTEM_ONE_BACKEND | default "von"}}'
    cmds:
      - uv run --locked python scripts/download_weights.py

  serve:
    desc: Run the HTTP API with local model weights
    env:
      # `slm` runs a small language model through llama.cpp and needs `llama-server` on PATH
      # (for example from `brew install llama.cpp`); `von` runs the bundled Von model.
      SYSTEM_ONE_BACKEND: '{{.SYSTEM_ONE_BACKEND | default "von"}}'
      # Default to PyTorch on the CPU because OpenVINO is only installed on Linux;
      # on Linux, run `task serve VON_DEVICE=openvino:cpu` for faster inference.
      VON_DEVICE: '{{.VON_DEVICE | default "cpu"}}'
      # Return the calibrated yes/no (Noul) probability unchanged so callers
      # can pick their own threshold (Von's default moves every answer below 0.2 or above 0.8).
      VON_NOUL_DECISION: raw
      # Turn off Von's chains, the extra calculation steps it runs on inputs containing numbers,
      # so every answer comes from one calibrated model pass.
      VON_CHAINS_DIR: off
      # Cap each request's `state` at 512 tokens (the model accepts 8,192), because answers get less
      # accurate as inputs grow and a long input delays every request queued behind it.
      VON_MAX_STATE_TOKENS: "512"
      # Reject a `state` longer than that limit with HTTP 422 instead of cutting out its middle,
      # so every answer uses the full input.
      VON_ON_OVERFLOW: refuse
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    cmds:
      - uv run --locked uvicorn system_one_service.app:app --host 0.0.0.0 --port 8000

  lint:
    desc: Lint source and tests
    cmds:
      - uv run --locked ruff check src scripts tests
      - uv run --locked ruff format --check src scripts tests

  fmt:
    desc: Format and sort Python code
    cmds:
      - uv run --locked ruff format src scripts tests
      - uv run --locked ruff check --fix src scripts tests

  test:
    desc: Run API tests without model weights
    cmds:
      - uv run --locked pytest -q

  check:
    desc: Run local checks
    deps: [lint, test]

  examples:
    desc: Run all examples, or select with EXAMPLE and CLI arguments after --
    cmds:
      - python3 scripts/run_examples.py --example {{.EXAMPLE | default "all"}} --base-url {{.BASE_URL | default "http://127.0.0.1:8000"}} --output reports/examples.json {{.CLI_ARGS}}

  examples-report:
    desc: Render a saved examples JSON report as offline HTML without model calls
    cmds:
      - python3 scripts/render_examples_report.py {{.REPORT | default "reports/examples.json" | shellQuote}} {{.CLI_ARGS}}

  benchmark:
    desc: Measure warm HTTP latency for a selected example
    cmds:
      - python3 scripts/benchmark.py --base-url {{.BASE_URL | default "http://127.0.0.1:8000"}} --output reports/benchmark.json {{.CLI_ARGS}}

  sdk-smoke:
    desc: Check Von HTTP SDK compatibility against a running service
    cmds:
      - uv run --locked python scripts/sdk_smoke.py --base-url {{.BASE_URL | default "http://127.0.0.1:8000"}}

  image-build:
    desc: Build the CPU image for the local architecture; set BACKEND=slm for the SLM image
    cmds:
      - docker build --target {{.BACKEND | default "von"}} --tag ${IMAGE:-system-one-classification:local} .

  image-smoke:
    desc: Test the built image with four CPUs and eight GiB of memory
    cmds:
      - sh scripts/image_smoke.sh ${IMAGE:-system-one-classification:local}

  image-up:
    desc: Start the built image on localhost port 18080 for manual API checks
    cmds:
      - docker run --detach --rm --name system-one-dev --cpuset-cpus=0-3 --memory=8g -p 127.0.0.1:18080:8000 ${IMAGE:-system-one-classification:local}

  image-down:
    desc: Stop the local API container
    cmds:
      - docker stop system-one-dev
