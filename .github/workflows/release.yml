name: CI and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: 0.10.10
      - uses: go-task/setup-task@v2
        with:
          version: 3.50.0
      - run: task setup
      - run: task check

  build-and-push:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        backend: [von, slm]
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          # Tag suffix for the SLM image; the Von image keeps the unsuffixed tags.
          - backend: slm
            variant: -slm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: 0.10.10
      - uses: go-task/setup-task@v2
        with:
          version: 3.50.0
      # The host runs the Von SDK check against the container, so it needs the von group.
      - run: task setup
      - uses: docker/setup-buildx-action@v3
      - name: Extract image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
            suffix=${{ matrix.variant }}-${{ matrix.arch }},onlatest=true
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build image for validation
        uses: docker/build-push-action@v5
        with:
          context: .
          target: ${{ matrix.backend }}
          platforms: ${{ matrix.platform }}
          load: true
          tags: |
            system-one-classification:ci
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=system-one${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=system-one${{ matrix.variant }}-${{ matrix.arch }}
      - name: Smoke-test the image
        env:
          IMAGE: system-one-classification:ci
        run: task image-smoke
      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push validated architecture
        uses: docker/build-push-action@v5
        with:
          context: .
          target: ${{ matrix.backend }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=system-one${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=system-one${{ matrix.variant }}-${{ matrix.arch }}

  publish-manifest:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-and-push
    runs-on: ubuntu-24.04
    permissions:
      # Write access lets tag builds create the GitHub release.
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Extract multiarch tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multiarch tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            for variant in "" -slm; do
              docker buildx imagetools create --tag "$tag$variant" "$tag$variant-amd64" "$tag$variant-arm64"
            done
          done <<< "$TAGS"
      - name: Verify anonymous pull
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker logout ghcr.io
          export DOCKER_CONFIG="$(mktemp -d)"
          docker pull "$IMAGE:$VERSION"
          docker pull "$IMAGE:$VERSION-slm"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
