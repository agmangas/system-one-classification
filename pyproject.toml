[project]
name = "system-one-classification"
version = "0.1.0"
description = "CPU-only classification and scoring service with bundled Von or small language model weights"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "huggingface-hub>=0.34,<2",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "ruff>=0.13,<1",
]
# Only the Von image installs these; the SLM image runs llama.cpp instead.
von = [
  "openvino==2026.4.0; sys_platform == 'linux'",
  "torch==2.9.1+cpu; sys_platform == 'linux'",
  "torch==2.9.1; sys_platform == 'darwin'",
  "von-sdk @ git+https://github.com/wfzyx/von.git@5ea5082f67d2bfc69336ce6150f6d05393d7fd27",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/system_one_service"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
